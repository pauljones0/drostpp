# Configuration wired to an external Drost container over MCP + host workspace sync

[run]
max_workers = 2
lease_seconds = 180
heartbeat_seconds = 15.0
max_total_tasks = 30
max_follow_ups_per_task = 4
enable_verify_phase = true

[budgets]
max_run_tokens = 1500000
max_run_wall_seconds = 3600.0
max_run_disk_bytes = 2147483648
min_free_disk_bytes = 268435456
min_available_memory_mb = 2048
default_task_tokens = 120000
default_task_wall_seconds = 300.0
default_task_memory_mb = 2048
default_task_disk_bytes = 268435456
max_output_bytes = 2097152
max_same_error_repeats = 2

[diversity]
enabled = true
knowledge_base_path = "./knowledge_base.jsonl"
kb_samples_per_task = 2
include_sibling_avoidance = true

[routing]
cooldown_seconds = 60.0

[[routing.tiers.fast]]
provider = "kimi"
model = "kimi-k2-turbo-preview"

[[routing.tiers.default]]
provider = "codex"
model = ""

[[routing.tiers.default]]
provider = "kimi"
model = "kimi-k2-turbo-preview"

[[routing.tiers.strong]]
provider = "codex"
model = ""

[providers.codex]
binary = "codex"
default_model = ""
sandbox = "workspace-write"

[providers.kimi]
mode = "api"
base_url = "https://api.moonshot.ai/v1"
api_key_env = "KIMI_API_KEY"
default_model = "kimi-k2-turbo-preview"
max_tool_turns = 8
timeout_seconds = 120.0

[container]
enabled = true
block_direct_docker = true
docker_binary = "docker"
memory_mb = 2048
pids_limit = 256
read_only = false
disk_limit_bytes = 536870912
max_per_run = 8
handoff_seconds = 30
log_max_size = "10m"
log_max_files = 3

[drost]
enabled = true
container_name = "drost-ai"
docker_binary = "docker"
mcp_command = "drost-mcp"
mcp_mode = "compact"
tool_categories = []
# Point this at your Docker volume mount on the host for automatic artifact sync:
workspace_host_path = "/var/lib/drost-workspace"
max_import_bytes = 33554432
